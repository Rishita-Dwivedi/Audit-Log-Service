spring:
  application:
    name: audit-log-service
  datasource:
    url: jdbc:h2:file:./data/auditlog;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

audit:
  chain:
    genesis-seed: "AUDIT-CHAIN-GENESIS-v1"
  retention:
    window-days: 90
  compliance:
    # docs/scenario-c.md: configurable rather than hardcoded, since the real "client account
    # data" resource-type list is a product/compliance decision this codebase can't make.
    client-data-resource-types: "ACCOUNT"
  security:
    max-request-bytes: 1048576
    jwt:
      # Dev-only HMAC secret. Real deployment needs a secret-manager-sourced key or, better,
      # a real OIDC identity provider -- see docs/SECURITY.md and docs/DECISIONS.md.
      secret: "dev-only-local-hmac-secret-change-me-before-any-real-deployment-3f8a1c"
      issuer: "audit-log-service-dev"
      audience: "audit-log-service-api"

management:
  endpoints:
    web:
      exposure:
        include: health
