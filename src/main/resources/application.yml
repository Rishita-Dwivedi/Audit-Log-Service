spring:
  application:
    name: audit-log-service
  datasource:
    url: jdbc:h2:file:./data/auditlog;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

audit:
  chain:
    genesis-seed: "AUDIT-CHAIN-GENESIS-v1"
