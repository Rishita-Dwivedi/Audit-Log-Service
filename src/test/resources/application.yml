spring:
  application:
    name: audit-log-service
  datasource:
    url: jdbc:h2:mem:audittest;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

audit:
  chain:
    genesis-seed: "AUDIT-CHAIN-GENESIS-v1"
  retention:
    window-days: 90
  security:
    jwt:
      secret: "test-only-hmac-secret-not-for-any-real-use-9b2e7d"
      issuer: "audit-log-service-dev"
      audience: "audit-log-service-api"
